name: Deploy to GitHub Pages

# Deploys are manual on purpose.
#
# This repo is worked on a single branch, so `main` was both the working branch
# and production: every commit went live within minutes, with no step in between
# where the site could be looked at first. Removing the push trigger separates
# committing from publishing without needing a second branch or a pull request.
#
# To publish: Actions -> "Deploy to GitHub Pages" -> Run workflow (on main),
# or `gh workflow run deploy.yml --ref main`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run indexnow
